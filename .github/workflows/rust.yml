name: Rust

# The Rust build's checks (the workspace in Cargo.toml, crates/): format, clippy, the tests and
# cargo-deny. While the C# app is the release line they run on the Rust branches only: pushes
# to rust/main and the port branches under rust/, and pull requests into rust/main.
# docker-rust.yml calls them too, so the octo-rust image has passed the same gate.
on:
  push:
    branches: ['rust/**']
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ['rust/main']
  workflow_call:
  workflow_dispatch:

# Superseded PR pushes are pointless to finish. github.workflow is the caller's name when
# docker-rust.yml calls this, so its run never waits behind, or cancels, a push run here.
concurrency:
  group: ${{ github.workflow }}-rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # rustup is on the runner; with no argument it installs what rust-toolchain.toml
      # names (the channel and the rustfmt and clippy components).
      - name: Rust toolchain
        run: rustup toolchain install

      # ~/.cargo (registry, git) and target/, keyed on the toolchain, Cargo.lock and the
      # manifests. Saved only from rust/main (and main, after the cutover), so port branches
      # and PRs read that cache but never evict it.
      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/rust/main' || github.ref == 'refs/heads/main' }}

      # ffmpeg for the Radio transcoder, loudness and spectrum tests; fpcalc for the
      # fingerprint tests; Noto CJK, Symbola and DejaVu, as in the image, so the cover tests
      # draw names in other scripts with the same fallback fonts. Tests that need a missing
      # tool skip themselves, so a gap here shows up as a skip, not a failure.
      - name: Install ffmpeg, fpcalc and cover fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools \
            fonts-noto-cjk fonts-symbola fonts-dejavu-core

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --tests -- -D warnings

      - name: Test
        run: cargo test --workspace

      # octo-sonic (sonic/) sits inside this workspace's folder but is its own project
      # (exclude in Cargo.toml). If that line goes, cargo refuses to run in sonic/; catch it
      # here rather than in ci.yml's sonic job.
      - name: sonic stays outside the workspace
        working-directory: sonic
        run: cargo metadata --format-version 1 --no-deps > /dev/null

  # Licenses, banned or duplicated crates and unknown sources (deny.toml). Advisories run
  # beside them but do not fail the build: a new RustSec advisory against a dependency is
  # news to act on, not a fault of the commit that happened to run when it was published.
  deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - bans licenses sources
          - advisories

    continue-on-error: ${{ matrix.checks == 'advisories' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: cargo deny check ${{ matrix.checks }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          # The action's container brings its own toolchain; match rust-toolchain.toml.
          rust-version: "1.99"
