name: Release app links

# Flakyfy is only the server; its apps are published at winters27/octo. After a release is
# published here, this links the newest app releases at the end of the Latest release's notes
# (.github/scripts/app_links.py). Its own edits use GITHUB_TOKEN and start nothing, so it cannot
# loop. A server release that docker.yml publishes starts nothing either, so docker.yml calls this.
on:
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: release-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Link the newest apps from the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/app_links.py
