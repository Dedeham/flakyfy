<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <title>Join Octo Family</title>
  <link rel="stylesheet" href="/admin/admin.css" />
  <link rel="stylesheet" href="/family/family.css" />
  <link rel="icon" type="image/png" href="/Assets/octo_logo.png" />
</head>
<body>
  <div class="ambient" aria-hidden="true"><span class="ambient-light a1"></span><span class="ambient-light a2"></span><span class="ambient-light a3"></span></div>
  <div class="fam-shell" style="max-width:760px">
    <header class="fam-top">
      <div class="fam-brand">
        <img src="/Assets/octo_logo.png" alt="" />
        <div>
          <div class="fam-brand-name">Octo Family</div>
          <div class="fam-brand-tag" id="host"></div>
        </div>
      </div>
    </header>
    <main id="join" aria-live="polite"><p class="fam-loading">Loading</p></main>
  </div>
  <dialog class="fam-sheet" id="sheet" aria-labelledby="sheet-title"></dialog>
  <div class="fam-toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="fam-loading">This page needs JavaScript.</p></noscript>
  <script src="/family/qr.js" defer></script>
  <script src="/family/common.js" defer></script>
  <script src="/family/join.js" defer></script>
</body>
</html>
