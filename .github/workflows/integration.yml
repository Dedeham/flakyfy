name: Integration

# The multi-user harness in tests/integration (FLA-12): a real Navidrome and Octo, three
# seeded users, generated tones only. Its own workflow file, so the jobs in ci.yml are not
# touched and cannot be broken by it.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the harness
        # run.sh prints the container logs itself on failure, before it tears the stack down.
        run: tests/integration/run.sh

